<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>운동 게임 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
  <style>
    :root {
      --primary: #4CAF50;
      --dark: #222;
      --light: #f4f4f4;
      --accent: #FF5722;
    }
    body { font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; margin:0; padding:0; }
    header { background: linear-gradient(135deg, var(--primary), #2e7d32); padding: 2rem; text-align: center; }
    h1 { margin:0; font-size: 2.5rem; }
    .level-display { font-size: 4rem; margin: 1rem 0; }
    .progress-container { width: 200px; height: 200px; margin: 0 auto; position: relative; }
    .progress-circle { fill: none; stroke: #333; stroke-width: 15; }
    .progress-fill { fill: none; stroke: var(--primary); stroke-width: 15; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card { background: var(--dark); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .exercises { grid-column: 1 / -1; }
    .exercise-item { display: grid; grid-template-columns: 1fr auto auto auto; gap: 1rem; align-items: center; margin-bottom: 1rem; padding: 1rem; background: #333; border-radius: 8px; }
    .exercise-item input[type="text"] { background: transparent; border: none; color: #eee; font-size: 1.2rem; }
    .exercise-item input[type="number"] { width: 80px; padding: 0.5rem; background: #444; border: none; color: #eee; border-radius: 4px; }
    button { background: var(--primary); border: none; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin: 0.5rem 0.5rem 0 0; }
    button.danger { background: var(--accent); }
    .rewards { grid-column: 1 / -1; }
    .reward-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .reward { text-align: center; padding: 1rem; background: #333; border-radius: 8px; opacity: 0.4; transition: opacity 0.5s; }
    .reward.unlocked { opacity: 1; border: 2px solid var(--primary); }
    .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .tab { padding: 0.8rem 1.5rem; background: #333; border-radius: 8px 8px 0 0; cursor: pointer; }
    .tab.active { background: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .level-up { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 100; }
    .level-up.show { display: flex; }
    .level-up h2 { font-size: 4rem; color: var(--primary); animation: bounce 1s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    input[type="date"] { background: #444; color: #eee; border: none; padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>운동 게임 대시보드</h1>
    <div class="level-display">레벨 <span id="current-level">1</span></div>
    <div class="progress-container">
      <svg viewBox="0 0 200 200">
        <circle class="progress-circle" cx="100" cy="100" r="90"/>
        <circle class="progress-fill" cx="100" cy="100" r="90" stroke-dasharray="565" stroke-dashoffset="565" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="progress-text"><span id="progress-text">0 남음</span></div>
    </div>
    <p id="total-reps">총 누적: 0 reps</p>
  </header>

  <main>
    <div class="card exercises">
      <div class="tabs">
        <div class="tab active" data-tab="today">기록 입력</div>
        <div class="tab" data-tab="chart">히스토리 차트</div>
        <div class="tab" data-tab="settings">설정</div>
      </div>

      <div id="today" class="tab-content active">
        <label>기록 날짜: <input type="date" id="record-date"/></label>
        <div id="exercise-list"></div>
        <button id="add-exercise-btn">+ 운동 추가</button>
        <button id="save-today-btn" style="background:#2196F3">기록 저장</button>
      </div>

      <div id="chart" class="tab-content">
        <canvas id="historyChart" height="300"></canvas>
      </div>

      <div id="settings" class="tab-content">
        <h3>레벨업 기준 (차등 적용)</h3>
        <p>각 레벨로 올라가기 위해 필요한 추가 reps</p>
        <div id="level-reqs-edit"></div>
        <button id="add-level-req-btn">+ 레벨 기준 추가</button>

        <h3 style="margin-top:2rem">보상 관리</h3>
        <div id="rewards-edit"></div>
        <button id="add-reward-btn">+ 보상 추가</button>
      </div>
    </div>

    <div class="card rewards">
      <h2>Unlock된 보상</h2>
      <div class="reward-grid" id="rewards-grid"></div>
    </div>
  </main>

  <div class="level-up" id="level-up">
    <h2>레벨업!</h2>
    <p>새로운 보상이 해금되었습니다!</p>
  </div>

  <script>
    const defaultExercises = ["풀업", "푸쉬업", "앱슬라이드", "스쿼트", "카프레이즈"];
    const defaultRewards = [
      {level: 2, name: "휴식 데이 쿠폰", desc: "하루 쉬어도 OK!", icon: "🏖️"},
      {level: 5, name: "좋아하는 음악 플레이리스트", desc: "운동 중 듣기", icon: "🎵"},
      {level: 10, name: "단백질 쉐이크 한 잔", desc: "자기 보상", icon: "🥤"},
      {level: 15, name: "새 운동화 구매 권한", desc: "동기부여!", icon: "👟"},
      {level: 20, name: "전신 마사지 데이", desc: "회복의 날", icon: "💆"}
    ];
    const defaultLevelReqs = [
      {toLevel: 2, requiredReps: 1000},
      {toLevel: 3, requiredReps: 1500},
      {toLevel: 4, requiredReps: 2000},
      {toLevel: 5, requiredReps: 3000},
      {toLevel: 6, requiredReps: 4000}
    ];

    let data = {
      exercises: defaultExercises.map(name => ({name})),
      history: {}, // "2026-01-13": {"풀업": 50, "푸쉬업": 100, ...}
      rewards: defaultRewards,
      levelReqs: defaultLevelReqs
    };

    if (localStorage.getItem("fitnessGameData")) {
      data = JSON.parse(localStorage.getItem("fitnessGameData"));
    }

    function saveData() {
      localStorage.setItem("fitnessGameData", JSON.stringify(data));
    }

    function getTotalReps() {
      let total = 0;
      for (const date in data.history) {
        for (const ex in data.history[date]) {
          total += data.history[date][ex];
        }
      }
      return total;
    }

    function getLevelInfo() {
      const total = getTotalReps();
      let cumulative = 0;
      let currentLevel = 1;
      let nextReq = data.levelReqs[0]?.requiredReps || 0;
      let currentReqIndex = 0;
      for (let i = 0; i < data.levelReqs.length; i++) {
        const req = data.levelReqs[i];
        if (cumulative + req.requiredReps > total) {
          nextReq = req.requiredReps - (total - cumulative);
          currentReqIndex = i;
          break;
        }
        cumulative += req.requiredReps;
        currentLevel = req.toLevel;
      }
      const percent = data.levelReqs[currentReqIndex] ? ((data.levelReqs[currentReqIndex].requiredReps - nextReq) / data.levelReqs[currentReqIndex].requiredReps) * 100 : 100;
      return { currentLevel, nextReps: nextReq, percent, cumulative };
    }

    function updateHeader() {
      const prevLevel = document.getElementById("current-level").textContent;
      const info = getLevelInfo();
      document.getElementById("current-level").textContent = info.currentLevel;
      document.getElementById("progress-text").textContent = info.nextReps > 0 ? `${info.nextReps} reps 남음` : "최고 레벨!";
      document.getElementById("total-reps").textContent = `총 누적: ${getTotalReps()} reps`;

      const circumference = 565;
      const offset = circumference - (info.percent / 100 * circumference);
      document.querySelector(".progress-fill").style.strokeDashoffset = offset;

      if (info.currentLevel > prevLevel) {
        document.getElementById("level-up").classList.add("show");
        setTimeout(() => document.getElementById("level-up").classList.remove("show"), 4000);
      }

      renderRewards();
    }

    function loadTodayRecords() {
      const selectedDate = document.getElementById("record-date").value || new Date().toISOString().slice(0,10);
      renderExercises(selectedDate);
    }

    function renderExercises(date = null) {
      const selectedDate = date || document.getElementById("record-date").value || new Date().toISOString().slice(0,10);
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";
      data.exercises.forEach((ex, i) => {
        const savedReps = data.history[selectedDate] && data.history[selectedDate][ex.name] ? data.history[selectedDate][ex.name] : 0;
        const div = document.createElement("div");
        div.className = "exercise-item";
        div.innerHTML = `
          <input type="text" value="${ex.name}" data-index="${i}" class="ex-name">
          <input type="number" min="0" value="${savedReps}" data-index="${i}" class="ex-reps">
          <button class="danger remove-ex" data-index="${i}">삭제</button>
        `;
        list.appendChild(div);
      });
    }

    function addExercise() {
      data.exercises.push({name: "새 운동"});
      saveData();
      loadTodayRecords();
    }

    function removeExercise(i) {
      const name = data.exercises[i].name;
      data.exercises.splice(i, 1);
      for (const date in data.history) {
        delete data.history[date][name];
      }
      saveData();
      loadTodayRecords();
      updateChart();
      updateHeader();
    }

    function saveToday() {
      const selectedDate = document.getElementById("record-date").value || new Date().toISOString().slice(0,10);
      if (!data.history[selectedDate]) data.history[selectedDate] = {};
      let dailyTotal = 0;
      document.querySelectorAll(".ex-reps").forEach(input => {
        const i = input.dataset.index;
        const name = data.exercises[i].name;
        const reps = Number(input.value) || 0;
        if (reps > 0) {
          data.history[selectedDate][name] = reps; // 덮어쓰기 (기존 + 추가가 아닌 현재 값 전체 저장)
          dailyTotal += reps;
        } else {
          delete data.history[selectedDate][name];
        }
      });
      saveData();
      updateChart();
      updateHeader();
      alert(`${selectedDate} 기록이 저장되었습니다! (총 ${dailyTotal} reps)`);
    }

    let chart;
    function updateChart() {
      const sortedDates = Object.keys(data.history).sort();
      const datasets = [];
      const colors = ["#4CAF50", "#2196F3", "#FF9800", "#F44336", "#9C27B0", "#00BCD4", "#FFEB3B", "#795548"];

      // 총합
      const totalData = sortedDates.map(date => {
        let sum = 0;
        for (const ex in data.history[date]) sum += data.history[date][ex];
        let cumulative = sum;
        for (let d of sortedDates.filter(d => d < date)) {
          for (const ex in data.history[d]) cumulative += data.history[d][ex];
        }
        return cumulative;
      });
      datasets.push({
        label: "총 누적",
        data: totalData,
        borderColor: "#FFFFFF",
        backgroundColor: "rgba(255,255,255,0.2)",
        tension: 0.3,
        fill: true
      });

      // 종목별
      data.exercises.forEach((ex, idx) => {
        const color = colors[idx % colors.length];
        const exData = sortedDates.map(date => {
          let cumulative = data.history[date][ex.name] || 0;
          for (let d of sortedDates.filter(d => d < date)) {
            cumulative += data.history[d][ex.name] || 0;
          }
          return cumulative;
        });
        datasets.push({
          label: ex.name,
          data: exData,
          borderColor: color,
          backgroundColor: color + "33",
          tension: 0.3
        });
      });

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("historyChart"), {
        type: "line",
        data: { labels: sortedDates, datasets },
        options: {
          scales: { x: { type: "time", time: { unit: "day" } } },
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    function renderRewards() {
      const grid = document.getElementById("rewards-grid");
      grid.innerHTML = "";
      const level = getLevelInfo().currentLevel;
      data.rewards.forEach(r => {
        const div = document.createElement("div");
        div.className = "reward" + (level >= r.level ? " unlocked" : "");
        div.innerHTML = `
          <div style="font-size:4rem">${r.icon}</div>
          <h3>${r.name}</h3>
          <p>${r.desc} (레벨 ${r.level})</p>
        `;
        grid.appendChild(div);
      });
    }

    function renderLevelReqsEdit() {
      const container = document.getElementById("level-reqs-edit");
      container.innerHTML = "";
      data.levelReqs.forEach((req, i) => {
        const div = document.createElement("div");
        div.style = "margin-bottom:1rem;padding:1rem;background:#333;border-radius:8px;";
        div.innerHTML = `
          레벨 ${req.toLevel} 도달 필요 reps <input type="number" value="${req.requiredReps}" data-index="${i}" class="level-req-reps">
          <button class="danger remove-level-req" data-index="${i}">삭제</button>
        `;
        container.appendChild(div);
      });
    }

    function renderRewardsEdit() {
      const container = document.getElementById("rewards-edit");
      container.innerHTML = "";
      data.rewards.forEach((r, i) => {
        const div = document.createElement("div");
        div.style = "margin-bottom:1rem;padding:1rem;background:#333;border-radius:8px;";
        div.innerHTML = `
          레벨 <input type="number" value="${r.level}" data-index="${i}" class="reward-level">
          이름 <input type="text" value="${r.name}" data-index="${i}" class="reward-name">
          설명 <input type="text" value="${r.desc}" data-index="${i}" class="reward-desc">
          아이콘 <input type="text" value="${r.icon}" data-index="${i}" class="reward-icon">
          <button class="danger remove-reward" data-index="${i}">삭제</button>
        `;
        container.appendChild(div);
      });
    }

    function addLevelReq() {
      const nextLevel = data.levelReqs.length > 0 ? Math.max(...data.levelReqs.map(r => r.toLevel)) + 1 : 2;
      data.levelReqs.push({toLevel: nextLevel, requiredReps: 1000});
      saveData();
      renderLevelReqsEdit();
      updateHeader();
    }

    function addReward() {
      data.rewards.push({level: getLevelInfo().currentLevel + 1, name:"새 보상", desc:"설명", icon:"🏆"});
      saveData();
      renderRewardsEdit();
    }

    // Event Listeners
    document.getElementById("record-date").value = new Date().toISOString().slice(0,10);
    document.getElementById("record-date").addEventListener("change", loadTodayRecords);

    document.getElementById("add-exercise-btn").addEventListener("click", addExercise);
    document.getElementById("save-today-btn").addEventListener("click", saveToday);
    document.getElementById("add-level-req-btn").addEventListener("click", addLevelReq);
    document.getElementById("add-reward-btn").addEventListener("click", addReward);

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
        if (tab.dataset.tab === "today") loadTodayRecords();
        if (tab.dataset.tab === "settings") {
          renderLevelReqsEdit();
          renderRewardsEdit();
        }
      });
    });

    document.getElementById("exercise-list").addEventListener("change", e => {
      if (e.target.classList.contains("ex-name")) {
        const i = e.target.dataset.index;
        const oldName = data.exercises[i].name;
        data.exercises[i].name = e.target.value;
        // 과거 기록 이름도 업데이트
        for (const date in data.history) {
          if (data.history[date][oldName] !== undefined) {
            data.history[date][e.target.value] = data.history[date][oldName];
            delete data.history[date][oldName];
          }
        }
        saveData();
        updateChart();
      }
    });

    document.getElementById("exercise-list").addEventListener("click", e => {
      if (e.target.classList.contains("remove-ex")) {
        removeExercise(e.target.dataset.index);
      }
    });

    document.getElementById("level-reqs-edit").addEventListener("change", e => {
      if (e.target.classList.contains("level-req-reps")) {
        const i = e.target.dataset.index;
        data.levelReqs[i].requiredReps = Number(e.target.value) || 1000;
        saveData();
        updateHeader();
      }
    });

    document.getElementById("level-reqs-edit").addEventListener("click", e => {
      if (e.target.classList.contains("remove-level-req")) {
        data.levelReqs.splice(e.target.dataset.index, 1);
        saveData();
        renderLevelReqsEdit();
        updateHeader();
      }
    });

    document.getElementById("rewards-edit").addEventListener("change", e => {
      const i = e.target.dataset.index;
      if (e.target.classList.contains("reward-level")) data.rewards[i].level = Number(e.target.value);
      if (e.target.classList.contains("reward-name")) data.rewards[i].name = e.target.value;
      if (e.target.classList.contains("reward-desc")) data.rewards[i].desc = e.target.value;
      if (e.target.classList.contains("reward-icon")) data.rewards[i].icon = e.target.value;
      saveData();
    });

    document.getElementById("rewards-edit").addEventListener("click", e => {
      if (e.target.classList.contains("remove-reward")) {
        data.rewards.splice(e.target.dataset.index, 1);
        saveData();
        renderRewardsEdit();
      }
    });

    // Init
    loadTodayRecords();
    updateHeader();
    updateChart();
    renderRewards();
  </script>
</body>
</html>
