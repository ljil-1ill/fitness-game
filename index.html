<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>운동 게임 대시보드</title>

  <!-- FullCalendar (v6는 JS가 CSS를 주입하므로 CSS link는 제거) -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --primary: #4CAF50;
      --dark: #1a1a1a;
      --darker: #111;
      --accent: #FF5722;
      --text: #eee;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--darker);
      color: var(--text);
      margin:0;
      padding:0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, var(--primary), #2e7d32);
      padding: 1.5rem 1rem;
      text-align: center;
    }
    h1 { margin:0; font-size: 2rem; }
    .total-info { font-size: 1.2rem; margin-top: 0.5rem; }
    main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      width: 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 900px) { main { grid-template-columns: 1fr 400px; } }

    .calendar-section {
      background: var(--dark);
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #calendar {
      max-width: 100%;
      background: #222;
      padding: 1rem;
      border-radius: 8px;
    }

    .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--dark);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .exercise-item {
      display: grid;
      grid-template-columns: 2fr 1fr 60px;
      gap: 1rem;
      align-items: center;
      padding: 0.8rem;
      background: #2a2a2a;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }
    .exercise-item input[type="text"] {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.1rem;
      width: 100%;
      outline: none;
    }
    .exercise-item input[type="number"] {
      background: #444;
      border: none;
      color: var(--text);
      padding: 0.6rem;
      border-radius: 4px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #66bb6a; }
    button.danger { background: var(--accent); }
    button.danger:hover { background: #f44336; }
    .level-list { margin-top: 1rem; }
    .level-item {
      padding: 0.5rem;
      background: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    canvas {
      max-width: 100%;
      background: #222;
      border-radius: 8px;
      padding: 1rem;
    }
    .fc-event { font-size: 0.9rem; padding: 2px 4px; }
  </style>
</head>

<body>
  <header>
    <h1>운동 게임 대시보드</h1>
    <div class="total-info" id="total-info">총 누적: 0 reps</div>
  </header>

  <main>
    <div class="calendar-section">
      <div id="calendar"></div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h2 id="selected-date-title">날짜 선택</h2>
        <div id="exercise-list"></div>
        <button id="add-exercise-btn">+ 운동 추가</button>
        <button id="save-today-btn" style="margin-top:1rem;">기록 저장</button>
      </div>

      <div class="card">
        <h2>종목별 레벨</h2>
        <div id="level-list" class="level-list"></div>
        <button id="auto-quadratic-btn" style="margin-top:1rem;background:#2196F3;">
          Quadratic 재설정 (base 200)
        </button>
      </div>

      <div class="card">
        <h2>종목별 누적 그래프</h2>
        <canvas id="perExerciseChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    const defaultExercises = ["풀업", "푸쉬업", "앱슬라이드", "스쿼트", "카프레이즈"];

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // 어떤 형태의 날짜 입력이 와도 YYYY-MM-DD로 강제
    function normalizeYMD(input) {
      if (typeof input === "string") {
        const m = input.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      }
      const d = (input instanceof Date) ? input : new Date(input);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function getLocalTodayYMD() {
      return normalizeYMD(new Date());
    }

    let data = {
      exercises: defaultExercises.map(name => ({ name })),
      history: {},
      levelReqs: []
    };

    function generateQuadratic(base = 200, maxLevel = 20) {
      const reqs = [];
      for (let n = 1; n < maxLevel; n++) {
        reqs.push({ toLevel: n + 1, requiredReps: base * n * n });
      }
      return reqs;
    }

    function saveData() {
      localStorage.setItem("fitnessGameData", JSON.stringify(data));
    }

    function loadData() {
      const raw = localStorage.getItem("fitnessGameData");
      if (!raw) return;

      const loaded = JSON.parse(raw);
      data = {
        exercises: loaded.exercises || defaultExercises.map(name => ({ name })),
        history: loaded.history || {},
        levelReqs: Array.isArray(loaded.levelReqs) ? loaded.levelReqs : []
      };
    }

    // 과거 버전에서 날짜 키가 YYYY-MM-DD가 아닐 수도 있으니 일괄 정규화(중복 키는 exercise별로 큰 값 우선)
    function normalizeHistoryKeysInPlace() {
      const newHistory = {};

      for (const key in data.history) {
        const norm = normalizeYMD(key);
        const day = data.history[key] || {};

        if (!newHistory[norm]) newHistory[norm] = {};

        for (const exName in day) {
          const v = Number(day[exName]) || 0;
          if (v <= 0) continue;

          // 중복이 있으면 max로 (합산으로 인한 중복 카운트 방지)
          newHistory[norm][exName] = Math.max(newHistory[norm][exName] || 0, v);
        }
      }

      data.history = newHistory;
    }

    // 초기 로드
    loadData();

    if (!Array.isArray(data.levelReqs) || data.levelReqs.length === 0) {
      data.levelReqs = generateQuadratic(200, 21);
    }

    normalizeHistoryKeysInPlace();
    saveData();

    function getTotalReps() {
      let total = 0;
      for (const date in data.history) {
        const day = data.history[date] || {};
        for (const ex in day) total += (Number(day[ex]) || 0);
      }
      return total;
    }

    function getExerciseCumulative(exName) {
      let cum = 0;
      for (const date in data.history) {
        cum += (Number(data.history[date]?.[exName]) || 0);
      }
      return cum;
    }

    function getLevelForExercise(exName) {
      const cum = getExerciseCumulative(exName);
      let level = 1;
      let cumulative = 0;

      for (const req of data.levelReqs) {
        if (cumulative + req.requiredReps > cum) break;
        cumulative += req.requiredReps;
        level = req.toLevel;
      }
      return level;
    }

    function updateTotalInfo() {
      document.getElementById("total-info").textContent = `총 누적: ${getTotalReps()} reps`;
    }

    function updateLevelList() {
      const list = document.getElementById("level-list");
      list.innerHTML = "";
      data.exercises.forEach(ex => {
        const level = getLevelForExercise(ex.name);
        const div = document.createElement("div");
        div.className = "level-item";
        div.textContent = `${ex.name}: 레벨 ${level}`;
        list.appendChild(div);
      });
    }

    let selectedDate = getLocalTodayYMD();
    let calendar;

    function getCalendarEventsArray() {
      const events = [];
      for (const dateKey in data.history) {
        const date = normalizeYMD(dateKey);
        const day = data.history[dateKey] || {};

        let total = 0;
        const details = [];

        for (const ex in day) {
          const reps = Number(day[ex]) || 0;
          total += reps;
          details.push(`${ex}: ${reps}`);
        }

        if (total > 0) {
          events.push({
            title: `총 ${total} reps`,
            start: date, // 반드시 YYYY-MM-DD
            allDay: true,
            tooltip: details.join('\n'),
            backgroundColor: '#4CAF50',
            borderColor: '#4CAF50'
          });
        }
      }
      return events;
    }

    function initCalendar() {
      calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: "dayGridMonth",
        headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,timeGridWeek" },

        // 핵심: events를 "함수형 소스"로 제공 -> 데이터 변경 후 refetchEvents()로 항상 최신 반영
        events: function(fetchInfo, successCallback) {
          successCallback(getCalendarEventsArray());
        },

        dateClick: function(info) {
          selectedDate = normalizeYMD(info.dateStr);
          document.getElementById("selected-date-title").textContent = `${selectedDate} 기록`;
          loadExercisesForDate(selectedDate);
        },

        eventClick: function(info) {
          // startStr이 YYYY-MM-DD 형태로 가장 안전
          selectedDate = normalizeYMD(info.event.startStr || info.event.start);
          document.getElementById("selected-date-title").textContent = `${selectedDate} 기록`;
          loadExercisesForDate(selectedDate);
        },

        eventDidMount: function(info) {
          info.el.title = info.event.extendedProps.tooltip;
        }
      });

      calendar.render();
    }

    function loadExercisesForDate(date) {
      const ymd = normalizeYMD(date);
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";

      data.exercises.forEach((ex, i) => {
        const saved = Number(data.history[ymd]?.[ex.name]) || 0;

        const div = document.createElement("div");
        div.className = "exercise-item";
        div.innerHTML = `
          <input type="text" value="${escapeAttr(ex.name)}" data-index="${i}" class="ex-name">
          <input type="number" min="0" value="${saved}" data-index="${i}" class="ex-reps">
          <button class="danger remove-ex" data-index="${i}">삭제</button>
        `;
        list.appendChild(div);
      });
    }

    function addExercise() {
      data.exercises.push({ name: "새 운동" });
      saveData();
      loadExercisesForDate(selectedDate);
      updateAll();
    }

    function removeExercise(i) {
      const idx = Number(i);
      if (!Number.isFinite(idx) || idx < 0 || idx >= data.exercises.length) return;

      const name = data.exercises[idx].name;
      data.exercises.splice(idx, 1);

      for (const date in data.history) {
        if (data.history[date] && data.history[date][name] !== undefined) {
          delete data.history[date][name];
          if (Object.keys(data.history[date]).length === 0) delete data.history[date];
        }
      }

      saveData();
      loadExercisesForDate(selectedDate);
      updateAll();
    }

    function saveToday() {
      const date = normalizeYMD(selectedDate);
      selectedDate = date;

      if (!data.history[date]) data.history[date] = {};

      let daily = 0;

      document.querySelectorAll(".ex-reps").forEach(inp => {
        const idx = Number(inp.dataset.index);
        if (!Number.isFinite(idx) || idx < 0 || idx >= data.exercises.length) return;

        const name = data.exercises[idx].name;
        const reps = Number(inp.value) || 0;

        if (reps > 0) {
          data.history[date][name] = reps;
          daily += reps;
        } else {
          delete data.history[date][name];
        }
      });

      if (Object.keys(data.history[date]).length === 0) {
        delete data.history[date];
      }

      saveData();
      // 저장 직후 폼을 다시 로드해서 “저장된 값 기준”으로 확정 표시
      loadExercisesForDate(selectedDate);
      updateAll();

      alert(`${date} 기록 저장! (+${daily} reps)`);
    }

    let perChart;

    function updatePerExerciseChart() {
      // 날짜 키를 정규화한 리스트로 만든다
      const rawKeys = Object.keys(data.history);
      const dates = rawKeys.map(k => normalizeYMD(k)).sort();

      // 중복 날짜가 생길 수 있으니 unique
      const uniqDates = [...new Set(dates)];

      const canvas = document.getElementById("perExerciseChart");
      const existing = Chart.getChart(canvas);
      if (existing) existing.destroy();

      const datasets = data.exercises.map((ex, i) => {
        const color = ["#4CAF50","#2196F3","#FF9800","#F44336","#9C27B0","#00BCD4","#FFEB3B","#795548"][i % 8];

        let running = 0;
        const cumData = uniqDates.map(date => {
          // date는 정규화되어 있으므로 그대로 접근
          running += (Number(data.history[date]?.[ex.name]) || 0);
          return running;
        });

        return {
          label: `${ex.name} (레벨 ${getLevelForExercise(ex.name)})`,
          data: cumData,
          borderColor: color,
          backgroundColor: color + "33",
          tension: 0.3,
          fill: true
        };
      });

      perChart = new Chart(canvas, {
        type: "line",
        data: { labels: uniqDates, datasets },
        options: {
          scales: {
            x: { type: "category" },
            y: { beginAtZero: true }
          },
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    function updateAll() {
      updateTotalInfo();
      updateLevelList();
      updatePerExerciseChart();

      if (calendar) {
        // 핵심: 함수형 events 소스이므로 refetchEvents()만 하면 최신 반영
        calendar.refetchEvents();
      }
    }

    // Listeners
    document.getElementById("add-exercise-btn").addEventListener("click", addExercise);
    document.getElementById("save-today-btn").addEventListener("click", saveToday);

    document.getElementById("auto-quadratic-btn").addEventListener("click", () => {
      data.levelReqs = generateQuadratic(200, 21);
      saveData();
      updateAll();
    });

    document.getElementById("exercise-list").addEventListener("change", e => {
      if (!e.target.classList.contains("ex-name")) return;

      const idx = Number(e.target.dataset.index);
      if (!Number.isFinite(idx) || idx < 0 || idx >= data.exercises.length) return;

      const oldName = data.exercises[idx].name;
      const newName = (e.target.value || "").trim() || "새 운동";
      if (oldName === newName) return;

      data.exercises[idx].name = newName;

      // history 키 마이그레이션 (중복 시 max)
      for (const date in data.history) {
        const day = data.history[date];
        if (!day) continue;

        if (day[oldName] !== undefined) {
          day[newName] = Math.max(Number(day[newName]) || 0, Number(day[oldName]) || 0);
          delete day[oldName];
        }
      }

      saveData();
      loadExercisesForDate(selectedDate);
      updateAll();
    });

    document.getElementById("exercise-list").addEventListener("click", e => {
      if (e.target.classList.contains("remove-ex")) {
        removeExercise(e.target.dataset.index);
      }
    });

    // Init
    document.addEventListener("DOMContentLoaded", () => {
      selectedDate = getLocalTodayYMD();
      document.getElementById("selected-date-title").textContent = `${selectedDate} 기록`;

      initCalendar();
      loadExercisesForDate(selectedDate);
      updateAll();
    });
  </script>
</body>
</html>
